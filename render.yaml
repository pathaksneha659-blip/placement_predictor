services:
  - type: web
    name: placeiq-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
  startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FRONTEND_URL
        fromService:
          type: web
          name: placeiq-frontend
          property: host

  - type: web
    name: placeiq-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: placeiq-backend
          property: host
